name: Python checks and Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q main.py questscope tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  windows-exe:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Package QuestScope
        run: python -m PyInstaller --noconfirm --clean --windowed --name QuestScope --collect-all PySide6 main.py
      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: QuestScope-Windows
          path: dist/QuestScope/
          if-no-files-found: error
          retention-days: 14
